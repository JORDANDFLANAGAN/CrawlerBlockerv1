[project]
name = "crawlerblocker"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "jordanflanagan", email = "jordanflanagan01@hotmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.156.8",
    "pydantic-settings>=2.16.1",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
crawlerblocker = "crawlerblocker:main"

[build-system]
requires = ["uv_build>=0.12.19,<0.13.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "httpx2>=2.16.0",
    "pytest>=9.1.1",
]
